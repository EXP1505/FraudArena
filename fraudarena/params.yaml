# Every threshold, seed and size lives here. Owner: M1.
seed: 42
world:
  accounts: 200
  days: 7
phase1:
  max_normal_hold_rate: 0.01
verifier:
  friction_upper_bound: 0.02
  variants_pass_rate: 0.80
ml_mode: tree   # tree | percentile (fallback)

# Baseline rule set v1 thresholds (docs/FraudArena_Phase1_Plan.pdf section 6).
# fa/rules/baseline_v1.json is generated from these; M4 tunes them so the
# normal-traffic hold+block rate stays under phase1.max_normal_hold_rate.
baseline_v1:
  R1_amount_ratio_30d: 10        # hold if amount_ratio_30d >= R1
  R2_new_payee_age_h: 1          # hold if payee_age_h < R2 and amount_ratio_30d >= R2_amount_ratio
  R2_amount_ratio: 3
  R3_n_pay_1h: 12                # block if n_pay_1h >= R3
  R4_sum_1h: 50000                # hold if device_changed_24h == 1 and sum_1h >= R4
  R5_fan_out_1h: 8                # block if fan_out_1h >= R5
  R6_night_amount_ratio: 6        # hold if night_flag == 1 and amount_ratio_30d >= R6
