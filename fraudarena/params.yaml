# Every threshold, size and seed lives here. Split by top-level section,
# one owner per section (docs/TIMELINE.md golden rule 5):
#   common (M1) · api (M2) · world, ml (M3) · rules, verifier, release (M4) · search, agents (M1)

common:
  seed: 42

api:
  host: 0.0.0.0
  port: 8000
  decisions_default_limit: 100

world:                       # M3. Money in integer paise, time in sim seconds. Seed = common.seed
  customers: 1000            # Phase-1 quick size: customers 200, history_days 7
  history_days: 30           # state warm-up / ML train
  validation_days: 7         # G5 friction, threshold choice
  holdout_days: 7            # reported numbers only
  merchants: 300
  sandbox_victims: 40        # history only; never in validation/holdout traffic
  sandbox_mules: 20
  segments:                  # share, median payment (paise), payments/day (Poisson mean)
    salaried: {share: 0.45, median: 150000, rate: 1.4}
    student:  {share: 0.20, median: 40000,  rate: 2.5}
    senior:   {share: 0.15, median: 120000, rate: 0.6}
    business: {share: 0.20, median: 600000, rate: 2.0}
  amount_sigma: 0.8          # LogNormal(log median, sigma)
  person_sigma: 0.4          # spread of personal median around the segment median
  devices: [1, 2]
  saved_payees: [3, 15]
  p2p_payee_share: 0.25      # share of saved payees that are other customers
  new_payee_share: 0.15      # share of payments to a brand-new payee
  new_payee_gap_min: [1, 15] # add_payee happens this many minutes before the payment
  daily_login_prob: 0.7
  weekend_factor: {retail: 1.1, business: 0.5}
  recurring:
    rent_prob: 0.5           # non-business accounts with monthly rent to a known landlord
    rent_mult: [4, 8]        # x personal median
    bills_per_month: [1, 3]
    bill_mult: [0.5, 2]
    subscription_prob: 0.6
    subscription_mult: [0.05, 0.3]
  lookalike_share: 0.02      # share of normal payments turned into look-alikes
  lookalike_mix:             # relative weights
    rent_new_landlord: 1     # large (8-15x), brand-new payee
    post_phone_change: 1     # normal payment from a phone first seen < 24 h ago
    festival: 1              # 5-10x to a known merchant
    new_supplier: 1          # business only: 3-8x to a brand-new payee
  golden_cases: 200

ml:
  mode: tree   # tree | percentile (fallback)
  tree:
    max_depth: 4
    min_samples_leaf: 30
    random_state: 7
  xgboost:
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.1
    random_state: 7
  mine_rules:
    min_leaf_fraud_share: 0.5
    min_support: 30
    max_val_fpr: 0.005

rules:
  # Baseline rule set v1 thresholds (docs/FraudArena_Phase1_Plan.pdf section 6).
  # fa/rules/baseline_v1.json is generated from these until M3 mines v1 from data.
  baseline_v1:
    R1_amount_ratio_30d: 10        # hold if amount_ratio_30d >= R1
    R2_new_payee_age_h: 1          # hold if payee_age_h < R2 and amount_ratio_30d >= R2_amount_ratio
    R2_amount_ratio: 3
    R3_n_pay_1h: 12                # block if n_pay_1h >= R3
    R4_sum_1h: 50000                # hold if device_changed_24h == 1 and sum_1h >= R4 (paise)
    R5_fan_out_1h: 8                # block if fan_out_1h >= R5
    R6_night_amount_ratio: 6        # hold if night_flag == 1 and amount_ratio_30d >= R6

verifier:
  max_normal_hold_rate: 0.01        # CP1 / Phase 1 sanity bound
  friction_upper_bound: 0.02        # G5: Wilson 95% upper of hold+block on validation traffic
  friction_upper_delta: 0.005       # G5: and no more than +0.5pp vs active version
  variants_pass_rate: 0.80          # G4: share of mutated variants that must still show loss = 0
  variants_n: 50                    # G4: number of mutated variants per gate run

release:
  require_different_checker: true   # G-release: approver must differ from round starter

search:
  trials: 100                        # Optuna TPE trials for worst_case search
  random_baseline_trials: 100        # matched-budget random-search baseline

agents:
  llm_model: claude-sonnet-5-5
  cache_dir: data/llm_cache
  attacker_retry_max: 2
  defender_retry_max: 3
  defender_max_added_fpr_pp: 0.5
