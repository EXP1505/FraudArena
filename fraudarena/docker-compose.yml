# Owner: M2.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: fraudarena
      POSTGRES_DB: fraudarena
    volumes: ["pgdata:/var/lib/postgresql/data", "./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:fraudarena@db:5432/fraudarena
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20
    working_dir: /app
    volumes: ["./web:/app"]
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["5173:5173"]
    depends_on:
      - api

volumes:
  pgdata:
